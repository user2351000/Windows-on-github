name: Windows Desktop (KDE workflow replaced)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Windows desktop
        uses: ./.github/actions/windows-desktop
        with:
          state-encryption-key: ${{ secrets.WINDOWS_DESKTOP_STATE_ENCRYPTION_KEY }}
